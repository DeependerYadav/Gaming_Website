<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
    <meta name="keywords" content="whack a mole game, free whack a mole, reflex game, mole game"/>
  <meta name="robots" content="index, follow"/>
  <meta property="og:title" content="Whack-a-Mole | Mini Games Hub"/>
  <meta property="og:description" content="Play Whack-a-Mole free online — hit moles as fast as they pop up. 30 seconds of reflex chaos!"/>
  <meta property="og:url" content="https://minigameshub.online/games/whack/"/>
  <meta property="og:type" content="website"/>
  <link rel="canonical" href="https://minigameshub.online/games/whack/"/><meta name="description" content="Play Whack-a-Mole – Mini Games Hub. Hit moles, dodge bombs, beat your score!"/>
  <title>Whack-a-Mole | Mini Games Hub</title>
  <link rel="manifest" href="../../manifest.json"/>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/games.css"/>
  <link rel="stylesheet" href="whack.css"/>
</head>
<body class="dark-mode">
<div class="game-page">

  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">🔨 Whack-a-Mole</h1>
    </div>
    <div class="game-header-controls">
      <div class="difficulty-selector">
        <button class="diff-btn active" data-spd="1200">Easy</button>
        <button class="diff-btn" data-spd="800">Med</button>
        <button class="diff-btn" data-spd="480">Hard</button>
      </div>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card whack-accent">
        <div class="stat-card-label">Score</div>
        <div class="stat-card-value" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best</div>
        <div class="stat-card-value" id="best">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Combo</div>
        <div class="stat-card-value" id="combo">x1</div>
      </div>
      <div class="stat-card whack-timer-card">
        <div class="stat-card-label">Time</div>
        <div class="stat-card-value" id="timer">30</div>
      </div>
    </div>

    <div class="game-actions">
      <button id="start-btn" class="btn-game btn-start">
        <i class="fa-solid fa-play"></i> Start Game
      </button>
    </div>

    <!-- Mole Grid -->
    <div class="mole-grid" id="mole-grid">
      <!-- 9 holes generated by JS -->
    </div>

    <!-- Result overlay -->
    <div id="result" class="whack-result hidden"></div>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script src="../../js/storage.js"></script>
<script src="whack.js"></script>
</body>
</html>
