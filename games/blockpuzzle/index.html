<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Play Block Puzzle free online — drag colorful pieces onto the grid, fill rows and columns to clear them. No download needed!"/>
  <title>Block Puzzle | Mini Games Hub</title>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="blockpuzzle.css"/>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7739890929299549" crossorigin="anonymous"></script>
</head>
<body>
<header class="ph">
  <a href="../../index.html" class="brand"><i class="fa-solid fa-gamepad"></i> Mini Games Hub</a>
  <a href="../../index.html" class="back"><i class="fa-solid fa-arrow-left"></i> Back</a>
</header>
<div class="wrapper">
  <h1>Block Puzzle</h1>
  <p class="sub">Drag pieces onto the grid — fill rows or columns to clear them!</p>
  <div class="stats-row">
    <div class="stat"><div class="sv" id="sv">0</div><div class="sl">Score</div></div>
    <div class="stat"><div class="sv" id="bv">0</div><div class="sl">Best</div></div>
    <div class="stat"><div class="sv" id="lv">0</div><div class="sl">Lines</div></div>
  </div>
  <div id="grid"></div>
  <div class="pieces-row" id="pr"></div>
  <button class="btn" onclick="startGame()"><i class="fa-solid fa-rotate"></i> New Game</button>
</div>

<div class="overlay" id="ov">
  <div class="ov-card">
    <h2>Game Over!</h2>
    <div class="score-big" id="ov-score">0</div>
    <p>No moves available. Try again!</p>
    <button class="btn" onclick="startGame();document.getElementById('ov').classList.remove('show')">
      <i class="fa-solid fa-rotate"></i> Play Again
    </button>
  </div>
</div>

<script src="blockpuzzle.js"></script>
</body>
</html>
