<script>
  // Sound toggle button
  (function() {
    const btn = document.getElementById('btn-sound');
    if (!btn) return;
    const settings = AppStorage.getSettings();
    btn.textContent = settings.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const cur = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !cur);
      btn.textContent = !cur ? '🔊' : '🔇';
    });
  })();
</script>
