<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="description" content="Play Tetris online – Mini Games Hub. Stack blocks, clear lines, level up!"/>
  <title>Tetris | Mini Games Hub</title>
  <link rel="manifest" href="../../manifest.json"/>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/games.css"/>
  <link rel="stylesheet" href="tetris.css"/>
</head>
<body class="dark-mode">
<div class="game-page">

  <!-- HEADER -->
  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn" id="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
      <h1 class="game-header-title">🟪 Tetris</h1>
    </div>
    <div class="game-header-controls">
      <button class="icon-btn" id="btn-sound-tetris" title="Toggle Sound" aria-label="Toggle Sound">
        <i class="fa-solid fa-volume-high" id="tetris-sound-icon"></i>
      </button>
    </div>
  </header>

  <!-- GAME CONTAINER -->
  <div class="game-container">

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card tetris-accent">
        <div class="stat-card-label">Score</div>
        <div class="stat-card-value" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best</div>
        <div class="stat-card-value" id="best">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Level</div>
        <div class="stat-card-value" id="level">1</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Lines</div>
        <div class="stat-card-value" id="lines">0</div>
      </div>
    </div>

    <!-- Main Game Layout -->
    <div class="tetris-layout">

      <!-- LEFT PANEL: Hold -->
      <div class="tetris-side-panel tetris-left-panel">
        <div class="tetris-panel-block">
          <span class="tetris-panel-label">HOLD</span>
          <canvas id="hold-canvas" width="100" height="100"></canvas>
        </div>
      </div>

      <!-- BOARD -->
      <div class="game-canvas-wrapper tetris-board-wrap" id="tetris-canvas-wrapper">
        <canvas id="board" width="300" height="600" role="img" aria-label="Tetris board"></canvas>

        <!-- Overlay -->
        <div class="game-overlay" id="overlay">
          <div class="overlay-emoji">🟪</div>
          <h2 class="overlay-title" id="overlay-title">TETRIS</h2>
          <p class="overlay-subtitle" id="overlay-msg">Stack blocks, clear lines, level up!</p>
          <div class="overlay-actions">
            <button id="start-btn" class="btn-game btn-start">
              <i class="fa-solid fa-play"></i> Start Game
            </button>
          </div>
          <div style="font-size:var(--text-xs); color:var(--clr-text-muted); margin-top:var(--space-3);">
            Press <kbd>Space</kbd> to start
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL: Next Queue -->
      <div class="tetris-side-panel tetris-right-panel">
        <div class="tetris-panel-block">
          <span class="tetris-panel-label">NEXT</span>
          <canvas id="next-canvas" width="100" height="300"></canvas>
        </div>
        <button id="restart-btn" class="btn-game btn-restart tetris-restart" style="display:none">
          <i class="fa-solid fa-rotate-right"></i> Restart
        </button>
      </div>

    </div><!-- /tetris-layout -->

    <!-- Action Buttons -->
    <div class="game-actions">
      <button class="btn-game btn-pause" id="btn-pause">
        <i class="fa-solid fa-pause"></i> Pause
      </button>
      <button class="btn-game btn-restart" id="btn-restart2" style="display:none">
        <i class="fa-solid fa-rotate-right"></i> Restart
      </button>
      <a href="../../index.html" class="btn-game btn-restart">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </div>

    <!-- Keyboard Controls Info -->
    <div class="controls-info">
      <div class="control-item"><kbd>←</kbd><kbd>→</kbd> Move</div>
      <div class="control-item"><kbd>↑</kbd> Rotate</div>
      <div class="control-item"><kbd>↓</kbd> Soft Drop</div>
      <div class="control-item"><kbd>Space</kbd> Hard Drop</div>
      <div class="control-item"><kbd>C</kbd> Hold</div>
      <div class="control-item"><kbd>P</kbd> Pause</div>
    </div>

    <!-- Mobile Touch Controls -->
    <div class="touch-controls tetris-touch" id="tetris-touch-controls">
      <div class="touch-row">
        <button class="touch-btn" id="t-hold" aria-label="Hold Piece">🫙</button>
        <button class="touch-btn" id="t-up" aria-label="Rotate">↑</button>
        <button class="touch-btn" id="t-harddrop" aria-label="Hard Drop">⬇⬇</button>
      </div>
      <div class="touch-row">
        <button class="touch-btn" id="t-left" aria-label="Move Left">←</button>
        <button class="touch-btn" id="t-down" aria-label="Soft Drop">↓</button>
        <button class="touch-btn" id="t-right" aria-label="Move Right">→</button>
      </div>
    </div>

  </div><!-- /game-container -->
</div><!-- /game-page -->

<!-- Line clear flash element -->
<div id="line-clear-flash" class="line-clear-flash"></div>

<script src="../../js/utils.js"></script>
<script src="../../js/storage.js"></script>
<script src="tetris.js"></script>
<script>
  // Sound toggle
  (function() {
    const btn  = document.getElementById('btn-sound-tetris');
    const icon = document.getElementById('tetris-sound-icon');
    if (!btn) return;
    const update = (on) => {
      icon.className = on ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
      btn.classList.toggle('sound-off', !on);
    };
    const settings = (window.AppStorage || {getSettings:()=>({})}).getSettings();
    update(settings.soundEnabled !== false);
    btn.addEventListener('click', () => {
      const cur = (window.AppStorage || {getSettings:()=>({soundEnabled:true})}).getSettings().soundEnabled !== false;
      (window.AppStorage || {setSetting:()=>{}}).setSetting('soundEnabled', !cur);
      update(!cur);
    });
  })();
</script>
</body>
</html>
