<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="description" content="Play Breakout free online on Mini Games Hub — smash neon bricks with a glowing ball! Progressive levels, power-ups, and 3 lives."/>
  <meta name="keywords" content="breakout game online, free breakout, brick breaker, neon breakout"/>
  <meta name="robots" content="index, follow"/>
  <meta property="og:title" content="Breakout | Mini Games Hub"/>
  <meta property="og:description" content="Play Breakout free — smash neon bricks, progressive levels, glowing effects!"/>
  <meta property="og:url" content="https://minigameshub.online/games/breakout/"/>
  <meta property="og:type" content="website"/>
  <link rel="canonical" href="https://minigameshub.online/games/breakout/"/>
  <title>Breakout | Mini Games Hub</title>
  <link rel="manifest" href="../../manifest.json"/>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/games.css"/>
  <link rel="stylesheet" href="breakout.css"/>
</head>
<body class="dark-mode">
<div class="game-page">

  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">🧱 Breakout</h1>
    </div>
    <div class="game-header-controls">
      <button class="icon-btn" id="btn-sound" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card breakout-accent">
        <div class="stat-card-label"><i class="fa-solid fa-star"></i> Score</div>
        <div class="stat-card-value" id="sv">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label"><i class="fa-solid fa-trophy"></i> Best</div>
        <div class="stat-card-value" id="bv">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label"><i class="fa-solid fa-layer-group"></i> Level</div>
        <div class="stat-card-value" id="lv">1</div>
      </div>
      <div class="stat-card breakout-lives-card">
        <div class="stat-card-label"><i class="fa-solid fa-heart"></i> Lives</div>
        <div class="stat-card-value" id="lf">❤️❤️❤️</div>
      </div>
    </div>

    <div class="game-canvas-wrapper breakout-canvas-wrap">
      <canvas id="canvas" width="640" height="480" role="img" aria-label="Breakout game"></canvas>
      <div id="lvl-announce" class="level-announce"></div>

      <!-- Start Overlay -->
      <div class="game-overlay" id="start-overlay">
        <div class="overlay-emoji">🧱</div>
        <h2 class="overlay-title">Breakout</h2>
        <p class="overlay-subtitle">Smash all the neon bricks before running out of lives!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="start-btn">
            <i class="fa-solid fa-play"></i> Start Game
          </button>
        </div>
        <div style="font-size: var(--text-xs); color: var(--clr-text-muted); margin-top: var(--space-3);">
          Mouse / Touch to move · Click / Space to launch
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div class="game-overlay hidden" id="ov">
        <div class="overlay-emoji" id="ov-emoji">💥</div>
        <h2 class="overlay-title" id="ov-title">Game Over</h2>
        <p class="overlay-score" id="ov-score">Score: 0</p>
        <p class="overlay-subtitle" id="ov-best">Best: 0</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="retry-btn">
            <i class="fa-solid fa-rotate-right"></i> Play Again
          </button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>

    <div class="controls-info">
      <div class="control-item"><i class="fa-solid fa-computer-mouse"></i> Mouse / Touch — move paddle</div>
      <div class="control-item"><kbd>Space</kbd> Launch ball</div>
      <div class="control-item"><kbd>←</kbd><kbd>→</kbd> Move paddle</div>
    </div>

    <div class="touch-controls" id="breakout-touch">
      <div class="touch-row">
        <button class="touch-btn" id="touch-left" aria-label="Move Left">←</button>
        <button class="touch-btn" id="touch-launch" aria-label="Launch">▲</button>
        <button class="touch-btn" id="touch-right" aria-label="Move Right">→</button>
      </div>
    </div>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script src="../../js/storage.js"></script>
<script src="breakout.js"></script>
<script>
  (function() {
    const btn = document.getElementById('btn-sound');
    if (!btn) return;
    const settings = AppStorage.getSettings();
    btn.textContent = settings.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const cur = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !cur);
      btn.textContent = !cur ? '🔊' : '🔇';
    });
  })();
</script>
</body>
</html>
