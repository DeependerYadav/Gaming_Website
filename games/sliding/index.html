<body class="dark-mode">
<div class="game-page">
  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">🧩 Sliding Puzzle</h1>
    </div>
    <div class="game-header-controls">
      <button class="icon-btn" id="btn-sound-sliding" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-card-label">Moves</div>
        <div class="stat-card-value" id="slide-moves">0</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-card-label">Time</div>
        <div class="stat-card-value" id="slide-timer">00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best</div>
        <div class="stat-card-value" id="slide-best">--:--</div>
      </div>
    </div>

    <!-- Difficulty selector -->
    <div class="slide-difficulty" id="slide-difficulty">
      <button class="diff-btn active" data-size="3" id="diff-3x3">3×3</button>
      <button class="diff-btn" data-size="4" id="diff-4x4">4×4</button>
      <button class="diff-btn" data-size="5" id="diff-5x5">5×5</button>
    </div>

    <div class="slide-board-wrap">
      <div class="slide-board" id="slide-board"></div>

      <div class="game-overlay" id="slide-overlay">
        <div class="overlay-emoji">🧩</div>
        <h2 class="overlay-title">Sliding Puzzle</h2>
        <p class="overlay-subtitle">Slide tiles into the correct order — fastest wins!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-start-slide">▶ Start Game</button>
        </div>
      </div>

      <div class="game-overlay hidden" id="slide-win">
        <div class="overlay-emoji" id="slide-win-emoji">🏆</div>
        <h2 class="overlay-title" id="slide-win-title">Puzzle Solved!</h2>
        <p class="overlay-score" id="slide-win-score">0 moves · 00:00</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-replay-slide">▶ Play Again</button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>

    <div class="game-actions">
      <button class="btn-game btn-restart" id="btn-restart-slide"><i class="fa-solid fa-shuffle"></i> Shuffle</button>
      <a href="../../index.html" class="btn-game btn-restart"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <div class="controls-info">
      <div class="control-item">Click or tap a tile adjacent to the empty space to slide it</div>
    </div>
  </div>
</div>

<script src="../../js/utils.js?v=1778843926"></script>
<script src="../../js/storage.js?v=1778843926"></script>
<script src="sliding.js?v=1778843926"></script>
<script src="../../js/how-to-play.js?v=1778843926"></script>
<script>
  (function() {
    const btn = document.getElementById('btn-sound-sliding');
    if (!btn) return;
    const s = AppStorage.getSettings();
    btn.textContent = s.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const c = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !c);
      btn.textContent = !c ? '🔊' : '🔇';
    });
  })();
</script>
</body>
</html>
