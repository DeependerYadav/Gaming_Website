<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Play Hangman free online on Mini Games Hub. Guess the hidden word letter by letter before the stick figure is drawn! Classic word game fun." />
  <meta name="keywords" content="hangman game online, free hangman, word guessing game, browser hangman" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Hangman | Mini Games Hub" />
  <meta property="og:description" content="Play Hangman free online — guess the word before you run out of tries!" />
  <meta property="og:url" content="https://minigameshub.online/games/hangman/" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://minigameshub.online/games/hangman/" />
  <title>Hangman | Mini Games Hub</title>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
  <!-- Font Awesome via Cloudflare (trusted CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../../css/style.css?v=1778637532" />
  <link rel="stylesheet" href="../../css/games.css?v=1778637532" />
  <link rel="stylesheet" href="hangman.css?v=1778637532" />
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7739890929299549" crossorigin="anonymous"></script>
</head>
<body class="dark-mode">

<div class="game-page">

  <!-- ===== GAME HEADER ===== -->
  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn" id="back-btn">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
      <h1 class="game-header-title">📝 Hangman</h1>
    </div>
    <div class="game-header-controls">
      <button class="icon-btn" id="btn-sound-hm" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <!-- ===== GAME CONTAINER ===== -->
  <div class="game-container">

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-card-label">Wins</div>
        <div class="stat-card-value" id="hm-wins">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Streak</div>
        <div class="stat-card-value" id="hm-streak">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best</div>
        <div class="stat-card-value" id="hm-best">0</div>
      </div>
    </div>

    <!-- Difficulty Selector -->
    <div class="difficulty-selector" id="hm-difficulty">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>

    <!-- Category Display -->
    <div class="hm-category" id="hm-category">Category: <span id="category-name">—</span></div>

    <!-- Game Area -->
    <div class="hm-game-area">

      <!-- Hangman Drawing -->
      <div class="hm-canvas-wrap">
        <canvas id="hangman-canvas" width="260" height="300"></canvas>
      </div>

      <!-- Word Display -->
      <div class="hm-word" id="hm-word"></div>

      <!-- Wrong letters -->
      <div class="hm-wrong" id="hm-wrong">
        <span class="hm-wrong-label">Wrong:</span>
        <span class="hm-wrong-letters" id="wrong-letters"></span>
      </div>

      <!-- Keyboard -->
      <div class="hm-keyboard" id="hm-keyboard"></div>

      <!-- Start Overlay -->
      <div class="game-overlay hm-overlay" id="hm-overlay">
        <div class="overlay-emoji">📝</div>
        <h2 class="overlay-title">Hangman</h2>
        <p class="overlay-subtitle">Guess the word letter by letter before the stickman is drawn!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-start-hm">▶ Start Game</button>
        </div>
        <div style="font-size: var(--text-xs); color: var(--clr-text-muted); margin-top: var(--space-3);">
          Click letters or use your keyboard. You have 6 wrong guesses!
        </div>
      </div>

      <!-- Game Over Overlay -->
      <div class="game-overlay hm-overlay hidden" id="hm-gameover">
        <div class="overlay-emoji" id="hm-gameover-emoji">🏆</div>
        <h2 class="overlay-title" id="hm-gameover-title">You Win!</h2>
        <p class="overlay-subtitle" id="hm-gameover-word"></p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-next-hm">▶ Next Word</button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="game-actions">
      <button class="btn-game btn-restart" id="btn-restart-hm"><i class="fa-solid fa-rotate-right"></i> New Word</button>
      <a href="../../index.html" class="btn-game btn-restart"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <!-- Controls Info -->
    <div class="controls-info">
      <div class="control-item"><kbd>A-Z</kbd> Guess Letter</div>
      <div class="control-item">6 wrong guesses allowed</div>
    </div>

  </div><!-- /game-container -->
</div><!-- /game-page -->

<!-- Scripts -->
<script src="../../js/utils.js?v=1778637532"></script>
<script src="../../js/storage.js?v=1778637532"></script>
<script src="hangman.js?v=1778637532"></script>
<script>
  (function() {
    const btn = document.getElementById('btn-sound-hm');
    if (!btn) return;
    const settings = AppStorage.getSettings();
    btn.textContent = settings.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const cur = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !cur);
      btn.textContent = !cur ? '🔊' : '🔇';
    });
  })();
</script>
<script src="../../js/how-to-play.js?v=1778637532"></script>
</body>
</html>
