<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="description" content="Play Word Search free online on Mini Games Hub — find hidden words in a neon letter grid. 4 themes, drag to select!"/>
  <meta name="keywords" content="word search online, free word search, find words, word puzzle game"/>
  <meta name="robots" content="index, follow"/>
  <meta property="og:title" content="Word Search | Mini Games Hub"/>
  <meta property="og:description" content="Play Word Search free — find hidden words in a neon letter grid!"/>
  <meta property="og:url" content="https://minigameshub.online/games/wordsearch/"/>
  <meta property="og:type" content="website"/>
  <link rel="canonical" href="https://minigameshub.online/games/wordsearch/"/>
  <title>Word Search | Mini Games Hub</title>
  <link rel="manifest" href="../../manifest.json"/>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/games.css"/>
  <link rel="stylesheet" href="wordsearch.css"/>
</head>
<body class="dark-mode">
<div class="game-page">

  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">🔍 Word Search</h1>
    </div>
    <div class="game-header-controls">
      <button class="icon-btn" id="btn-sound" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card ws-accent">
        <div class="stat-card-label"><i class="fa-solid fa-clock"></i> Time</div>
        <div class="stat-card-value" id="timer">00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label"><i class="fa-solid fa-check-double"></i> Found</div>
        <div class="stat-card-value" id="found-c">0 / 0</div>
      </div>
    </div>

    <div class="game-actions" style="margin-bottom: var(--space-2);">
      <button class="btn-game btn-start" id="new-game-btn">
        <i class="fa-solid fa-rotate-right"></i> New Game
      </button>
    </div>

    <div class="ws-main-area">
      <div class="ws-grid-wrap">
        <div id="ws-grid" class="ws-grid"></div>
      </div>
      <div class="ws-word-list">
        <h3 class="ws-list-title"><i class="fa-solid fa-magnifying-glass"></i> Find These Words</h3>
        <div id="word-list-items" class="ws-list-items"></div>
      </div>
    </div>

    <!-- Victory Overlay -->
    <div class="ws-overlay hidden" id="ov">
      <div class="ws-overlay-card">
        <div class="overlay-emoji">🎉</div>
        <h2 class="overlay-title">All Found!</h2>
        <p class="overlay-score" id="ov-msg">Great job!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="retry-btn">
            <i class="fa-solid fa-rotate-right"></i> New Game
          </button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script src="../../js/storage.js"></script>
<script src="wordsearch.js"></script>
<script>
  (function() {
    const btn = document.getElementById('btn-sound');
    if (!btn) return;
    const settings = AppStorage.getSettings();
    btn.textContent = settings.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const cur = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !cur);
      btn.textContent = !cur ? '🔊' : '🔇';
    });
  })();
</script>
</body>
</html>
