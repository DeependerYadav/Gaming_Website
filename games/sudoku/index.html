<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <meta name="description" content="Play Sudoku free online on Mini Games Hub — neon dark theme, 3 difficulty levels, pencil marks, undo, hints, and auto-validation!"/>
  <meta name="keywords" content="sudoku online, free sudoku, puzzle game, number puzzle, brain game"/>
  <meta name="robots" content="index, follow"/>
  <meta property="og:title" content="Sudoku | Mini Games Hub"/>
  <meta property="og:description" content="Play Sudoku free online — 3 difficulty levels, pencil marks, hints!"/>
  <meta property="og:url" content="https://minigameshub.online/games/sudoku/"/>
  <meta property="og:type" content="website"/>
  <link rel="canonical" href="https://minigameshub.online/games/sudoku/"/>
  <title>Sudoku | Mini Games Hub</title>
  <link rel="manifest" href="../../manifest.json"/>
  <link rel="icon" type="image/png" href="../../assets/icons/icon-96x96.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="../../css/style.css"/>
  <link rel="stylesheet" href="../../css/games.css"/>
  <link rel="stylesheet" href="sudoku.css"/>
</head>
<body class="dark-mode">
<div class="game-page">

  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">🔢 Sudoku</h1>
    </div>
    <div class="game-header-controls">
      <div class="difficulty-selector" id="diff-selector">
        <button class="diff-btn active" data-diff="easy">Easy</button>
        <button class="diff-btn" data-diff="medium">Med</button>
        <button class="diff-btn" data-diff="hard">Hard</button>
      </div>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card sudoku-accent">
        <div class="stat-card-label"><i class="fa-solid fa-clock"></i> Time</div>
        <div class="stat-card-value" id="timer-val">00:00</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label"><i class="fa-solid fa-xmark"></i> Errors</div>
        <div class="stat-card-value" id="errors-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label"><i class="fa-solid fa-trophy"></i> Best</div>
        <div class="stat-card-value" id="best-val">--</div>
      </div>
    </div>

    <div class="sudoku-game-area">
      <div class="sudoku-board-wrap">
        <div id="board" class="sudoku-board"></div>
      </div>

      <div class="sudoku-controls">
        <div class="sudoku-actions">
          <button class="sudoku-act-btn" id="pencil-btn">
            <i class="fa-solid fa-pencil"></i>
            <span>Pencil</span>
          </button>
          <button class="sudoku-act-btn" id="undo-btn">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Undo</span>
          </button>
          <button class="sudoku-act-btn" id="hint-btn">
            <i class="fa-solid fa-lightbulb"></i>
            <span>Hint</span>
          </button>
          <button class="sudoku-act-btn" id="new-game-btn">
            <i class="fa-solid fa-rotate-right"></i>
            <span>New</span>
          </button>
        </div>

        <div class="sudoku-numpad" id="numpad"></div>
      </div>
    </div>

    <!-- Victory Overlay -->
    <div class="sudoku-overlay hidden" id="win-overlay">
      <div class="sudoku-overlay-card">
        <div class="overlay-emoji">🎉</div>
        <h2 class="overlay-title">Solved!</h2>
        <p class="overlay-score" id="win-msg">You completed the puzzle!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="win-new-btn">
            <i class="fa-solid fa-rotate-right"></i> Play Again
          </button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../../js/utils.js"></script>
<script src="../../js/storage.js"></script>
<script src="sudoku.js"></script>
</body>
</html>
