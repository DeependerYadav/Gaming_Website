      </div>
      <div class="stat-card">

      </div>
    </div>

        <button class="simon-pad" data-color="yellow" id="pad-yellow"></button>
        <button class="simon-pad" data-color="blue" id="pad-blue"></button>
        <div class="simon-center" id="simon-center">
          <span class="simon-center-round" id="center-round">0</span>
        </div>
      </div>

        <div class="overlay-emoji">🎨</div>
        <h2 class="overlay-title">Simon Says</h2>
        <p class="overlay-subtitle">Watch the pattern, then repeat it!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-start-simon">▶ Start Game</button>
        </div>
      </div>

      <div class="game-overlay hidden" id="simon-gameover">
        <div class="overlay-emoji" id="simon-go-emoji">💀</div>
        <h2 class="overlay-title" id="simon-go-title">Game Over!</h2>
        <p class="overlay-score" id="simon-go-score">You reached round 0</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-retry-simon">▶ Try Again</button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>

<script>
  (function() {
    const btn = document.getElementById('btn-sound-simon');
    if (!btn) return;
    const s = AppStorage.getSettings();
    btn.textContent = s.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const c = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !c);
      btn.textContent = !c ? '🔊' : '🔇';
    });
  })();
</script>
