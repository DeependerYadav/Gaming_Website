<body class="dark-mode">
<div class="game-page">
  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">🎨 Simon Says</h1>
    </div>
    <div class="game-header-controls">
      <button class="icon-btn" id="btn-sound-simon" title="Toggle Sound">🔊</button>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card highlight">
        <div class="stat-card-label">Round</div>
        <div class="stat-card-value" id="simon-round">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best</div>
        <div class="stat-card-value" id="simon-best">0</div>
      </div>
    </div>

    <div class="simon-status" id="simon-status">Press Start to Play!</div>

    <div class="simon-board-wrap">
      <div class="simon-board" id="simon-board">
        <button class="simon-pad" data-color="green" id="pad-green"></button>
        <button class="simon-pad" data-color="red" id="pad-red"></button>
        <button class="simon-pad" data-color="yellow" id="pad-yellow"></button>
        <button class="simon-pad" data-color="blue" id="pad-blue"></button>
        <div class="simon-center" id="simon-center">
          <span class="simon-center-round" id="center-round">0</span>
        </div>
      </div>

      <div class="game-overlay" id="simon-overlay">
        <div class="overlay-emoji">🎨</div>
        <h2 class="overlay-title">Simon Says</h2>
        <p class="overlay-subtitle">Watch the pattern, then repeat it!</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-start-simon">▶ Start Game</button>
        </div>
      </div>

      <div class="game-overlay hidden" id="simon-gameover">
        <div class="overlay-emoji" id="simon-go-emoji">💀</div>
        <h2 class="overlay-title" id="simon-go-title">Game Over!</h2>
        <p class="overlay-score" id="simon-go-score">You reached round 0</p>
        <div class="overlay-actions">
          <button class="btn-game btn-start" id="btn-retry-simon">▶ Try Again</button>
          <a href="../../index.html" class="btn-game btn-restart">🏠 Home</a>
        </div>
      </div>
    </div>

    <div class="game-actions">
      <button class="btn-game btn-restart" id="btn-restart-simon"><i class="fa-solid fa-rotate-right"></i> Restart</button>
      <a href="../../index.html" class="btn-game btn-restart"><i class="fa-solid fa-house"></i> Home</a>
    </div>

    <div class="controls-info">
      <div class="control-item">Watch the sequence, then click/tap the pads in the same order</div>
    </div>
  </div>
</div>

<script src="../../js/utils.js?v=1778637532"></script>
<script src="../../js/storage.js?v=1778637532"></script>
<script src="simon.js?v=1778637532"></script>
<script src="../../js/how-to-play.js?v=1778637532"></script>
<script>
  (function() {
    const btn = document.getElementById('btn-sound-simon');
    if (!btn) return;
    const s = AppStorage.getSettings();
    btn.textContent = s.soundEnabled !== false ? '🔊' : '🔇';
    btn.addEventListener('click', () => {
      const c = AppStorage.getSettings().soundEnabled;
      AppStorage.setSetting('soundEnabled', !c);
      btn.textContent = !c ? '🔊' : '🔇';
    });
  })();
</script>
</body>
</html>
