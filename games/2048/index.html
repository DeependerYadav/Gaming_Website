<body class="dark-mode">
<div class="game-page">

  <header class="game-header">
    <div class="game-header-left">
      <a href="../../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
      <h1 class="game-header-title">✦ 2048</h1>
    </div>
    <div class="game-header-controls">
      <button id="undo-btn" class="icon-btn g2048-icon" title="Undo" aria-label="Undo">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <button id="restart-btn" class="icon-btn g2048-icon" title="New Game" aria-label="New Game">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </header>

  <div class="game-container">
    <div class="stats-bar">
      <div class="stat-card g2048-accent">
        <div class="stat-card-label">Score</div>
        <div class="stat-card-value" id="score">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Best</div>
        <div class="stat-card-value" id="best">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Moves</div>
        <div class="stat-card-value" id="moves">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Target</div>
        <div class="stat-card-value" id="target-val">2048</div>
      </div>
    </div>

    <!-- Board -->
    <div class="g2048-board-wrap">
      <div id="grid-background" class="grid-background"></div>
      <div id="tile-container"  class="tile-container"></div>

      <!-- Game over overlay -->
      <div id="game-over-overlay" class="g2048-overlay hidden">
        <div class="overlay-emoji" id="over-emoji">😵</div>
        <h2 class="overlay-title" id="over-title">Game Over!</h2>
        <p class="overlay-subtitle">Score: <span id="final-score" style="color:var(--clr-neon-yellow);font-weight:800">0</span></p>
        <div class="overlay-actions">
          <button id="retry-btn" class="btn-game btn-start">
            <i class="fa-solid fa-rotate-right"></i> Try Again
          </button>
          <a href="../../index.html" class="btn-game btn-restart">
            <i class="fa-solid fa-house"></i> Home
          </a>
        </div>
      </div>
    </div>

    <!-- Controls info -->
    <div class="controls-info">
      <div class="control-item"><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> Move</div>
      <div class="control-item"><i class="fa-solid fa-hand-pointer"></i> Swipe</div>
      <div class="control-item"><kbd>Z</kbd> Undo</div>
    </div>
  </div>
</div>

<!-- Score add animation layer -->
<div id="score-add" class="score-add-anim"></div>

<script src="../../js/utils.js?v=1778637532"></script>
<script src="../../js/storage.js?v=1778637532"></script>
<script src="2048.js?v=1778637532"></script>
<script src="../../js/how-to-play.js?v=1778637532"></script>
</body>
</html>
